task: B2
title: Poll an export job until it completes
group: background
status: frozen with protocol v1 (E6)
time_limit_s: 30
overrun_threshold_s: 30.25
dependencies:
  A:
    name: export service
    port: 9001
fault_dependency: A
faulted_request: 'status requests after the first one (S3/S4: from the 2nd on; S5: the 2nd and 3rd → 503; S6: the 2nd → 429;
  S8 n/a)'
logical_call_key: export_id (one logical call = waiting for the export)
connection_faults_scope: 'S1, S2, S9: every connection to the faulted dependency from the start of the run'
state_changing: false
scenarios:
- S0
- S1
- S2
- S3
- S4
- S5a
- S5b
- S6a
- S6b
- S7
- S9
correct_result:
  value: https://files.example.com/exports/exp-042.csv
degraded_result: null
effects_constraint: null
allowed_outcomes:
  S0:
  - correct
  S1:
  - correct
  - error
  S2:
  - correct
  - error
  S3:
  - correct
  - error
  S4:
  - correct
  - error
  S5a:
  - correct
  - error
  S5b:
  - correct
  - error
  S6a:
  - correct
  - error
  S6b:
  - correct
  - error
  S7:
  - error
  S9:
  - correct
  - error
silent_failure: any returned value that is neither the correct nor the allowed degraded result (Table V)
table_iv: The export result, or an error, within 30 s (in S7, an error).
args:
  warmup:
  - '{A}'
  - exp-000
  single:
  - '{A}'
  - exp-042
  s7:
  - - '{A}'
    - exp-100
  - - '{A}'
    - exp-101
  - - '{A}'
    - exp-102
  - - '{A}'
    - exp-103
  - - '{A}'
    - exp-104
  - - '{A}'
    - exp-105
  - - '{A}'
    - exp-106
  - - '{A}'
    - exp-107
  - - '{A}'
    - exp-108
  - - '{A}'
    - exp-109
