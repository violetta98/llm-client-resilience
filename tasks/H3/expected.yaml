  - degraded
  S6a:
  - correct
  - degraded
  S6b:
  - correct
  - degraded
  S7:
  - degraded
  S9:
  - correct
  - degraded
silent_failure: any returned value that is neither the correct nor the allowed degraded result (Table V)
table_iv: The best price of the other two within 3 s.
