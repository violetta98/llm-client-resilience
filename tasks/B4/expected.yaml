task: B4
title: Deliver a webhook for a given event; the receiver deduplicates by event ID
group: background
status: frozen with protocol v1 (E6)
time_limit_s: 30
overrun_threshold_s: 30.25
dependencies:
  A:
    name: webhook receiver
    port: 9001
fault_dependency: A
faulted_request: the webhook POST
logical_call_key: event id (body)
connection_faults_scope: 'S1, S2, S9: every connection to the faulted dependency from the start of the run'
state_changing: true
scenarios:
- S0
- S1
- S2
- S3
- S4
- S5a
- S5b
- S6a
- S6b
- S7
- S8
- S9
correct_result:
  value: returns normally; event accepted once
degraded_result: null
effects_constraint: at most one delivery_accepted per event id
allowed_outcomes:
  S0:
  - correct
  S1:
  - correct
  - error
  S2:
  - correct
  - error
  S3:
  - correct
  - error
  S4:
  - correct
  - error
  S5a:
  - correct
  - error
  S5b:
  - correct
  - error
  S6a:
  - correct
  - error
  S6b:
  - correct
  - error
  S7:
  - error
  S8:
  - correct
  - error
  S9:
  - correct
  - error
silent_failure: any returned value that is neither the correct nor the allowed degraded result (Table V)
table_iv: At most one delivery per event ID, or an error, within 30 s.
