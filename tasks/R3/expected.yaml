task: R3
title: Download a report file and save it
group: read
status: frozen with protocol v1 (E6)
time_limit_s: null
overrun_threshold_s: null
dependencies:
  A:
    name: reporting service
    port: 9001
fault_dependency: A
faulted_request: GET /v1/reports/{id}/download (the only request)
logical_call_key: report_id
connection_faults_scope: 'S1, S2, S9: every connection to the faulted dependency from the start of the run'
state_changing: false
scenarios:
- S0
- S1
- S2
- S3
- S4
- S5a
- S5b
- S6a
- S6b
- S7
- S9
correct_result:
