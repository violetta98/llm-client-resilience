  - correct
  S1:
  - correct
  - error
  S2:
  - correct
  - error
  S3:
  - correct
  - error
  S4:
  - correct
  - error
  S5a:
  - correct
  - error
  S5b:
  - correct
  - error
  S6a:
  - correct
  - error
  S6b:
  - correct
  - error
  S7:
  - correct
  - error
  S9:
  - correct
  - error
silent_failure: any returned value that is neither the correct nor the allowed degraded result (Table V)
table_iv: Correct result, or an error; never a partial file reported as complete (a returned value with a missing, short or
  wrong file is a silent failure).
